[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lst-kuep-vlp"
version = "0.1.0"
description = "LST KÜP/VLP Dokumentations- und Auswertungssystem"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "openpyxl>=3.1.5",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "pdfplumber>=0.11.0",
    "numpy>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
